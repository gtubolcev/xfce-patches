# sd_kokoro: Kokoro voices (the Russian kokoro-ru by zaakirio), loaded into
# the module in the background when speech-dispatcher starts (KokoroPreload)
# or with the first message.
# Defaults shown.

# models: subdirectories kokoro-<lang>[-...], also ~/.local/share/kokoro-tts
#KokoroModelsDir "/usr/share/kokoro-tts"
# the voice of a language, one line per language; clients that ask for a
# voice by name still get it. Without it, the voice type chooses: MALEn /
# FEMALEn is the n-th voice of that gender.
#KokoroVoice "ru" "kokoro-ru-sveta"
# the stress dictionary (word<TAB>phonemes, sorted), the one of Vosk TTS
#KokoroDictionary "/usr/share/vosk-tts/vosk-model-tts-ru-0.9-multi/dictionary.sorted"
# the directory with espeak-ng-data whose ru_dict honours stress marks
#KokoroEspeakData "/usr/share/speech-dispatcher-kokoro"
# load the model when speech-dispatcher starts, not with the first message;
# the memory stays taken even when another synthesizer is used
#KokoroPreload 1
# CPU threads, 0 = number of CPUs, at most 4
#KokoroThreads 0
# the first piece of a message is cut at a comma after this many characters,
# so the first sound comes sooner; 0 = only at sentence ends
#KokoroFirstChunk 40
#Debug 0
