# sd_vosk: Vosk TTS (alphacep) models loaded into the module, about 6 s
# with BERT, 4 s without, in the background when speech-dispatcher starts
# (VoskPreload) or with the first message.
# Defaults shown.

# models: subdirectories (vosk-model-tts-<lang>-...), also
# ~/.local/share/vosk-tts
#VoskModelsDir "/usr/share/vosk-tts"
# the voice of a language, one line per language; clients that ask for a
# voice by name still get it. Without it, the voice type chooses: MALEn /
# FEMALEn is the n-th voice of that gender.
#VoskVoice "ru" "vosk-ru-female-1"
# the BERT model gives the intonation of the whole sentence; without it
# the speech is flatter, but the module takes about 350 MB of memory
# instead of 1.3 GB and loads 2 s sooner
#VoskBert 1
# load the model when speech-dispatcher starts, not with the first message;
# the memory stays taken even when another synthesizer is used
#VoskPreload 1
# CPU threads, 0 = number of CPUs, at most 4
#VoskThreads 0
# the first piece of a message is cut at a comma after this many characters,
# so the first sound comes sooner; 0 = only at sentence ends
#VoskFirstChunk 40
#Debug 0
