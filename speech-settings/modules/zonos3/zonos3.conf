# sd_zonos3: ZONOS3-Mini through zonos3-server. The server starts with the first
# message (about 4 s on the GPU, 7 s on the CPU) and stops after Zonos3IdleTimeout seconds
# without speech (default one hour). It survives speech-dispatcher reloads: the restarted module
# takes the running server over.
# Defaults shown.

#Zonos3Server "/usr/bin/zonos3-server"
#Zonos3Model "/usr/share/zonos3/gguf/zonos3-ptq.gguf"
# voices: <lang>-<name>.embedding.npy, offered as zonos3-<lang>-<name>
#Zonos3VoicesDir "/usr/share/zonos3/voices"
# the voice of a language, one line per language; clients that ask for a
# voice by name still get it. Without it, the voice type chooses: MALEn /
# FEMALEn is the n-th voice of that gender ("male"/"female" in the name).
#Zonos3Voice "ru" "zonos3-ru-male-1"
#Zonos3IdleTimeout 3600
# load the server as soon as speech-dispatcher starts, not with the first
# message: about 2 s sooner, but the memory stays taken while speech-dispatcher
# runs, even when another synthesizer is used; for ZONOS as the DefaultModule
#Zonos3Preload 0
#Zonos3Loudness -20
#Zonos3Seed 99
# run on the GPU (Vulkan, about 1.3 GB video memory); falls back to the CPU
# (1.9 GB RAM) when that fails
#Zonos3Gpu 1
# CPU threads, 0 = number of CPUs, at most 4
#Zonos3Threads 0
#Zonos3LoadTimeout 120
# the first piece of a message is cut at a comma after this many characters,
# so the first sound comes sooner; 0 = only at sentence ends
#Zonos3FirstChunk 40
#Debug 0
