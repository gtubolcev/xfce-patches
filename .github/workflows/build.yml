name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['packages/**', 'scripts/**', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: 'Source package to build (empty = every package in packages/)'
        required: false
        default: ''

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.m.outputs.packages }}
    steps:
      - uses: actions/checkout@v5
      - id: m
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          # one build per package for 26.04, plus one per port to an older
          # release in packages/<pkg>/<codename>/
          if [ -n "$INPUT_PACKAGE" ]; then
            pkgs=$INPUT_PACKAGE
          else
            pkgs=$(find packages -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          fi
          pk=$(for p in $pkgs; do
                 echo "$p resolute"
                 for d in packages/$p/*/BASE; do
                   [ -f "$d" ] && echo "$p $(basename "$(dirname "$d")")"
                 done
               done | jq -Rsc 'split("\n") | map(select(. != "") | split(" ") | {package: .[0], dist: .[1]})')
          echo "packages=$pk" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: matrix
    if: needs.matrix.outputs.packages != '[]'
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.target.dist }}
    name: build (${{ matrix.target.package }}, ${{ matrix.target.dist }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.packages) }}
    steps:
      - name: Prepare container
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential devscripts equivs quilt fakeroot dpkg-dev
      - uses: actions/checkout@v5
      - name: Build ${{ matrix.target.package }}
        env:
          DEBIAN_FRONTEND: noninteractive
          DEBFULLNAME: ${{ github.actor }}
          DEBEMAIL: ${{ github.actor }}@users.noreply.github.com
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: scripts/build-package.sh "${{ matrix.target.package }}" out
      - uses: actions/upload-artifact@v5
        with:
          name: debs-${{ matrix.target.package }}-${{ matrix.target.dist }}
          path: out/*.deb

  # each release also goes to the PPA, signed with a key of its own that is
  # registered in Launchpad (secret PPA_GPG_KEY, armored private key)
  ppa:
    needs: [matrix, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    name: ppa (${{ matrix.target.package }}, ${{ matrix.target.dist }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.packages) }}
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends devscripts dput dpkg-dev
      - name: Import the signing key
        env:
          PPA_GPG_KEY: ${{ secrets.PPA_GPG_KEY }}
        run: |
          [ -n "$PPA_GPG_KEY" ] || { echo "::error::secret PPA_GPG_KEY is not set"; exit 1; }
          echo "$PPA_GPG_KEY" | gpg --batch --import
          echo "SIGN_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')" >> "$GITHUB_ENV"
      - name: Upload ${{ matrix.target.package }} for ${{ matrix.target.dist }}
        env:
          RELEASE: ${{ github.ref_name }}
        run: scripts/upload-ppa.sh "${{ matrix.target.package }}" "${{ matrix.target.dist }}"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # what's new: the message of the annotated tag
          REF=$(gh api "repos/${{ github.repository }}/git/ref/tags/${{ github.ref_name }}" -q '.object.type + " " + .object.sha')
          if [ "${REF% *}" = tag ]; then
            { echo "## What's new"; echo; gh api "repos/${{ github.repository }}/git/tags/${REF#* }" -q .message; echo; } > notes.md
          fi
          cat >> notes.md <<'EOF'
          Packages for Xubuntu, amd64. Pick the files for your release by the version in their names:

          | Xubuntu | Xfce | xfce4-settings files |
          |---|---|---|
          | 26.04 (resolute) | 4.20 | `*_4.20.1-*` |
          | 24.04 (noble) | 4.18 | `*_4.18.4-*` |

          Download all files for your release (e.g. both `xfce4-settings` and `xfce4-helpers`) into an empty folder and install them together:

          ```
          sudo apt install ./*.deb
          ```

          Then log out and back in. To go back to the stock Ubuntu packages, reinstall them with `sudo apt install --reinstall --allow-downgrades <package>=<ubuntu version>`.
          EOF
          gh release create "${{ github.ref_name }}" out/*.deb --repo "${{ github.repository }}" --notes-file notes.md --generate-notes
