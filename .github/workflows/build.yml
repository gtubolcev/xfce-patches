name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['packages/**', 'thunar-disk-usage/**', 'scripts/**', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: 'Source package or subproject directory to build (empty = all)'
        required: false
        default: ''

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.m.outputs.packages }}
      ppa: ${{ steps.m.outputs.ppa }}
    steps:
      - uses: actions/checkout@v5
      - id: m
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          # one build per package for Ubuntu 26.04 and Debian 13 (both with
          # packages/<pkg>/patches, unless a port of its own exists), plus one
          # per port in packages/<pkg>/<codename>/: an older Ubuntu release,
          # or "arch" for Arch Linux. Subprojects of our own (a directory
          # with debian/ in the repo root) are built for 26.04, 24.04,
          # Debian 13 and, with arch/PKGBUILD, Arch Linux.
          native=$(for d in */debian/control; do [ -f "$d" ] && dirname "$(dirname "$d")"; done)
          if [ -n "$INPUT_PACKAGE" ]; then
            pkgs=$INPUT_PACKAGE
          else
            pkgs="$(find packages -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort) $native"
          fi
          # $3: deb (patched Ubuntu source package) or native
          target() {
            case $2 in
              arch) echo "$1 $2 archlinux:latest arch" ;;
              bookworm|trixie|forky|sid) echo "$1 $2 debian:$2 ${3:-deb}" ;;
              *) echo "$1 $2 ubuntu:$2 ${3:-deb}" ;;
            esac
          }
          all=$(for p in $pkgs; do
                  if [ -f "$p/debian/control" ]; then
                    for dist in resolute noble trixie; do target "$p" "$dist" native; done
                    [ -f "$p/arch/PKGBUILD" ] && target "$p" arch
                    continue
                  fi
                  target "$p" resolute
                  [ -f "packages/$p/trixie/BASE" ] || target "$p" trixie
                  for d in packages/$p/*/BASE; do
                    [ -f "$d" ] && target "$p" "$(basename "$(dirname "$d")")"
                  done
                done)
          json() { jq -Rsc 'split("\n") | map(select(. != "") | split(" ") | {package: .[0], dist: .[1], image: .[2], kind: .[3]})'; }
          echo "packages=$(echo "$all" | json)" | tee -a "$GITHUB_OUTPUT"
          echo "ppa=$(echo "$all" | grep ' ubuntu:' | json)" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: matrix
    if: needs.matrix.outputs.packages != '[]'
    runs-on: ubuntu-latest
    container: ${{ matrix.target.image }}
    name: build (${{ matrix.target.package }}, ${{ matrix.target.dist }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.packages) }}
    steps:
      - name: Prepare container
        if: matrix.target.kind != 'arch'
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/*.sources
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential devscripts equivs quilt fakeroot dpkg-dev
      - uses: actions/checkout@v5
      - name: Build ${{ matrix.target.package }}
        if: matrix.target.kind == 'deb'
        env:
          DEBIAN_FRONTEND: noninteractive
          DEBFULLNAME: ${{ github.actor }}
          DEBEMAIL: ${{ github.actor }}@users.noreply.github.com
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: scripts/build-package.sh "${{ matrix.target.package }}" out
      - name: Build ${{ matrix.target.package }}
        if: matrix.target.kind == 'native'
        env:
          DEBIAN_FRONTEND: noninteractive
          DEBFULLNAME: ${{ github.actor }}
          DEBEMAIL: ${{ github.actor }}@users.noreply.github.com
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: scripts/build-native.sh "${{ matrix.target.package }}" out
      - name: Build ${{ matrix.target.package }}
        if: matrix.target.kind == 'arch'
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: scripts/build-arch.sh "${{ matrix.target.package }}" out
      - uses: actions/upload-artifact@v5
        with:
          name: pkgs-${{ matrix.target.package }}-${{ matrix.target.dist }}
          path: out/*

  # the README screenshot, taken from the packages just built; committed only
  # when the picture changed (the clock and the settings are fixed). Pushes
  # with GITHUB_TOKEN do not start another workflow run.
  screenshot:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    permissions:
      contents: write
    steps:
      - run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: pkgs-xfce4-settings-resolute
          path: debs
      - uses: actions/download-artifact@v5
        with:
          name: pkgs-thunar-disk-usage-resolute
          path: debs
      - run: scripts/screenshot.sh debs docs/theme-schedule.png
      - run: scripts/screenshot-tdu.sh debs docs/thunar-disk-usage.png
      - name: Commit the screenshots if they changed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          shots="docs/theme-schedule.png docs/thunar-disk-usage.png"
          if git diff --quiet -- $shots; then
            echo "screenshots unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: Update the screenshots" -- $shots
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

  # each release also goes to the PPA, signed with a key of its own that is
  # registered in Launchpad (secret PPA_GPG_KEY, armored private key)
  ppa:
    needs: [matrix, build]
    if: startsWith(github.ref, 'refs/tags/v') && needs.matrix.outputs.ppa != '[]'
    runs-on: ubuntu-latest
    name: ppa (${{ matrix.target.package }}, ${{ matrix.target.dist }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.ppa) }}
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends devscripts dput dpkg-dev
      - name: Import the signing key
        env:
          PPA_GPG_KEY: ${{ secrets.PPA_GPG_KEY }}
        run: |
          [ -n "$PPA_GPG_KEY" ] || { echo "::error::secret PPA_GPG_KEY is not set"; exit 1; }
          echo "$PPA_GPG_KEY" | gpg --batch --import
          echo "SIGN_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')" >> "$GITHUB_ENV"
      - name: Upload ${{ matrix.target.package }} for ${{ matrix.target.dist }}
        env:
          RELEASE: ${{ github.ref_name }}
        run: scripts/upload-ppa.sh "${{ matrix.target.package }}" "${{ matrix.target.dist }}"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # what's new: the message of the annotated tag
          REF=$(gh api "repos/${{ github.repository }}/git/ref/tags/${{ github.ref_name }}" -q '.object.type + " " + .object.sha')
          if [ "${REF% *}" = tag ]; then
            { echo "## What's new"; echo; gh api "repos/${{ github.repository }}/git/tags/${REF#* }" -q .message; echo; } > notes.md
          fi
          cat >> notes.md <<'EOF'
          Packages for amd64. Pick the files for your distribution by the version in their names:

          | Distribution | Xfce | xfce4-settings files |
          |---|---|---|
          | Xubuntu 26.04 (resolute) | 4.20 | `*_4.20.1-1ubuntu*` |
          | Xubuntu 24.04 (noble), Linux Mint 22 | 4.18 | `*_4.18.4-*` |
          | Debian 13 (trixie), MX Linux 25 | 4.20 | `*_4.20.1-1+xfcepatches*` (no `ubuntu` in the name) |
          | Arch Linux, Manjaro, EndeavourOS | 4.20 | `xfce4-settings-xfcepatches-*.pkg.tar.zst` |

          The Thunar disk usage plugin is a package of its own that works with the stock Thunar (4.18 and later): `thunar-disk-usage-plugin_*~resolute_amd64.deb` (26.04), `*~noble_*` (24.04, Mint 22), `*~trixie_*` (Debian 13), `thunar-disk-usage-plugin-*.pkg.tar.zst` (Arch). Install it alone with `sudo apt install ./thunar-disk-usage-plugin_*.deb` (or `pacman -U`) and run `thunar -q`.

          **Ubuntu, Debian:** download all `.deb` files for your release (e.g. both `xfce4-settings` and `xfce4-helpers`) into an empty folder and install them together:

          ```
          sudo apt install ./*.deb
          ```

          To go back to the stock packages, reinstall them with `sudo apt install --reinstall --allow-downgrades <package>=<distribution version>`. On Ubuntu the [PPA](https://launchpad.net/~gtubolcev/+archive/ubuntu/xfce-patches) is easier, it also brings updates.

          **Arch:** the package replaces `xfce4-settings` (pacman asks to remove it):

          ```
          sudo pacman -U ./xfce4-settings-xfcepatches-*.pkg.tar.zst
          ```

          To go back: `sudo pacman -S xfce4-settings`.

          Then log out and back in, or run `xfsettingsd --replace &`: the running settings daemon stays the old one until then.
          EOF
          gh release create "${{ github.ref_name }}" out/* --repo "${{ github.repository }}" --notes-file notes.md --generate-notes
